services:
  app:
    build: .
    restart: unless-stopped
    # Keep the image read-only; data and temporary files use explicit mounts.
    read_only: true
    # Provide a non-persistent writable directory for runtime temporary files.
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    # The entrypoint needs these only to repair a mounted data volume.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    ports:
      # Publish only on the host for a reverse proxy or local access.
      - "127.0.0.1:8080:8080"
    volumes:
      # Keep SQLite data when the application container is replaced.
      - expense-data:/data

volumes:
  expense-data:
