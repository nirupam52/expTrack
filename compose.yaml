services:
  app:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - expense-data:/data

volumes:
  expense-data:
