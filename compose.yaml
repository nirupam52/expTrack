services:
  backend:
    build: ./backend
    environment:
      EXPTRACK_SESSION_COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    volumes:
      - expense-data:/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  expense-data:
