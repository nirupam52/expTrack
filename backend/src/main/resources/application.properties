spring.application.name=exptrack
spring.datasource.url=jdbc:sqlite:${EXPTRACK_DATABASE_PATH:exptrack.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${EXPTRACK_SESSION_COOKIE_SECURE:true}
exptrack.auth.max-attempts=10
exptrack.auth.window-seconds=60
